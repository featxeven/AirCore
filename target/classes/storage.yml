# AirCore - Storage Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# --------------------------------------------------
# DATABASE
# --------------------------------------------------
database:

  # SQLITE   - file-based, no additional setup required
  # MYSQL    - requires a MySQL 8.0+ server
  # MARIADB  - uses the MySQL connector, compatible driver
  # MONGODB  - requires a MongoDB 5.0+ server (standalone, replica set, or Atlas)
  driver: SQLITE

  # Prefix applied to all plugin tables across all drivers.
  # When sharing a database across servers, this must be identical on all of them.
  table-prefix: "ac_"

  sqlite:
    file: "data/database.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "aircore"
    user: "root"
    password: ""
    ssl: false
    auto-reconnect: true

    pool:
      size: 5
      name: "AirCore-Pool"              # Internal HikariCP pool label, shown in thread names and logs
      connection-timeout: 30000         # ms before giving up acquiring a connection
      idle-timeout: 600000              # ms a connection can sit idle before being released
      max-lifetime: 1800000             # ms before a connection is retired and replaced

  mongodb:
    # Full connection URI (e.g. mongodb+srv://user:pass@cluster.mongodb.net).
    uri: ""

    host: "localhost"
    port: 27017
    database: "aircore"
    user: ""
    password: ""
    auth-source: "admin"                # Database the user's credentials are defined against
    ssl: false

    pool:
      min-size: 0
      max-size: 5
      connect-timeout: 10000            # ms before giving up establishing a connection
      server-selection-timeout: 5000    # ms before giving up finding a suitable server
      idle-timeout: 600000              # ms a connection can sit idle before being released
      max-lifetime: 1800000             # ms before a connection is retired and replaced