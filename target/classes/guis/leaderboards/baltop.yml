# AirCore - leaderboards/baltop.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the leaderboard logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: leaderboards-browser

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Money Leaderboard</bold></gradient> <dark_gray>- <gray>Page %page%/%pages%"
  rows: 6

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Which leaderboard (an id from data/leaderboards.yml) this GUI displays.
  leaderboard: baltop

  # Slots where ranked entries are rendered.
  entry-slots: [9-44]

  # How each ranked player is rendered inside entry-slots.
  entry:
    template: leaderboards-entry

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-3, 5-8, 46-47, 51-52]

  # --- Header ---
  header:
    slots: 4
    material: GOLD_INGOT
    display-name: "<gradient:#5AD1F2:#736EFE><bold>Money Leaderboard</bold></gradient>"
    lore:
      - "<dark_gray>Leaderboard"
      - " "
      - " <dark_gray>- <gray>Ranked players: <white>%total%"
      - " <dark_gray>- <gray>Refreshes every: <white>%interval%"

  no-entries:
    template: leaderboards-no-entries
    slots: 22

  # --- Footer ---
  previous-page:
    template: previous-page
    slots: 45

  next-page:
    template: next-page
    slots: 53

  search:
    template: search-button
    slots: 48
    actions:
      any:
        - "[sound] $click"
        - "[search] type:leaderboard page:1 restore:<page:current>"

  info:
    template: leaderboards-info
    slots: 49

  close:
    template: close-button
    slots: 50