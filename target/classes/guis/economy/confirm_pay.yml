# AirCore - economy/confirm_pay.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own;
# to disable this GUI, remove its GUI entry from commands.yml

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Payment</bold></gradient>"
  rows: 3

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-8, 18-26]

  target-head:
    template: target-head
    slots: 13

  confirm:
    slots: 11
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Confirm</bold>"
    lore:
      - "<gray>Click to confirm and send %amount%"
      - "<gray>to <white>%target%</white>."
      - " "
      - "<gray>Tax: <red>%tax_plain%"
    actions:
      any:
        - "[request] type:pay target:%target_realname% amount:%amount_raw%"
        - "=can:pay:%target_realname% [sound] $success"
        - "[close]"

  close:
    template: close-button
    slots: 15