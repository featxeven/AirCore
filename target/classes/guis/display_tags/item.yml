# AirCore - display_tags/item.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the display-tags logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: display-tag-item

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Item Preview</bold></gradient> <dark_gray>- <white><gray>%target%</gray>'s %item%"
  rows: 3

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slots where the previewed item is placed.
  item-slots: 13

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-3, 5-8, 18-26]

  target-head:
    slots: 4
    material: head-%target_realname%
    display-name: "<white>%target%<gray>'s <white>%item%"