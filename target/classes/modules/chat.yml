# AirCore - modules/chat
# Docs: https://airdevelopment.gitbook.io/docs/

# When set to false, the entire chat module is disabled.
# Only turn this off if you want to handle chat with a different plugin entirely.
#
# You may still need to manually disable certain commands related to this module (in commands.yml).
enabled: true

# --------------------------------------------------
# GENERAL
# --------------------------------------------------
general:
  cooldown: 3                 # Seconds a player must wait before sending another message; -1 = disabled
  radius: -1                  # Blocks; limits who receive the message by proximity; -1 = global (no limit)
                              # Only used as a fallback when channels are disabled or unresolved.

  # Controls when AirCore processes chat messages compared to other plugins.
  #
  # AirCore automatically skips any chat message that another plugin has already canceled.
  # This setting just changes AirCore's position in line.
  #
  # - Raise this toward HIGHEST if AirCore is overriding another plugin's chat formatting
  #   or custom chat system. This lets the other plugin run first and cancel the message.
  # - Lower this toward LOW or NORMAL if you want AirCore to handle and format the chat
  #   before other plugins get a chance to change it.
  #
  # Valid options: LOWEST, LOW, NORMAL, HIGH, HIGHEST, MONITOR
  event-priority: HIGH

# --------------------------------------------------
# FORMAT
# --------------------------------------------------
format:
  enabled: true

  # Reusable fragments. Reference with <temp:name> or, if the template defines
  # {1}, {2}, ... placeholders, pass args positionally: <temp:name:arg1:arg2:...>
  templates:
    hover: "<hover:show_text:'<yellow>Click to <gold>send a message'><click:suggest_command:'/msg %player_realname%'>%player%</click></hover>"
    # {1} = badge color, {2} = badge text, {3} = name color
    # badge: "<{1}><bold>{2}</bold></{1}> <{3}>%player%"

  groups:
    # _DEFAULT_ used when no group matches
    _DEFAULT_: "<gray>[Member] <temp:hover></gray><dark_gray>:</dark_gray> %message%"
    owner: "<dark_red>[Owner]</dark_red> <red><temp:hover></red><dark_gray>:</dark_gray> %message%"
    admin: "<red>[Admin] <temp:hover></red><dark_gray>:</dark_gray> %message%"
    vip: "<green>[Vip]</green> <green><temp:hover></green><dark_gray>:</dark_gray> %message%"
    # custom: "<dark_gray>[%player_ping%ms] %luckperms_prefix% <gold>%player% <dark_gray>:</dark_gray> <rainbow>%message%"

# --------------------------------------------------
# CHANNELS
# --------------------------------------------------
channels:
  # Channel command is also controlled in-game.
  # To disable it, disable the command in commands.yml as well.

  enabled: true
  default: global               # Channel players are placed in on join if they have no saved preference
  remember-channel: true        # When true, a player's last channel is restored when they rejoin

  # Each channel definition supports:
  #   format               - the line format for this channel
  #   radius               - blocks; ignored unless visibility is PUBLIC
  #   prefix               - character(s) typed at the start of a message to route into this channel for that one message
  #   description          - shown in /channel's channel list
  #   visibility           - PUBLIC     - delivered by 'radius' like normal chat
  #                          PRIVATE    - 'radius' is ignored; only players currently switched into this channel
  #                                       (via /channel) receive its messages, and while switched in, those
  #                                       players stop receiving every other channel's messages too
  #                          RESTRICTED - same delivery as PRIVATE (members only), but members keep receiving
  #                                       PUBLIC channels normally on top of it
  #   announce-membership  - when true, other members of this channel are told when someone switches in or out
  definitions:
    global:
      format: "<gray>[G] %group_format%"    # %group_format% inherits the matched entry from format.groups
      radius: -1
      prefix: "!"                           # Character typed at the start of a message to route into this channel; "" = none
      description: "Default channel available on the server"

    local:
      format: "<dark_gray>[L] <white>%player%</white> <dark_gray>> <gray>%message%"
      radius: 150               # Only players within this many blocks receive the message (in the same world)
      prefix: "."
      # description: "Channel used in this world only"

    trade:
      format: "<gold>[Trade] <yellow>%player%</yellow> <dark_gray>> <white>%message%"
      radius: -1
      prefix: "$"

    # staff:
    #   format: "<red>[Staff] <gray>%player%</gray> <dark_gray>> <white>%message%"
    #   visibility: RESTRICTED
    #   prefix: "@"
    #   description: "Staff channel - members also see normal chat"

    # party:
    #   format: "<light_purple>[Party] <white>%player%</white> <dark_gray>> <gray>%message%"
    #   visibility: PRIVATE
    #   prefix: "%"
    #   description: "Private channel - only party members receive messages"
    #   announce-membership: true

# --------------------------------------------------
# PLAYER INPUT FORMATTING
# --------------------------------------------------
player-input:
  signs:
    enabled: false              # Apply color/format permissions to sign text
  anvil:
    enabled: false              # Apply color/format permissions to anvil rename text
  books:
    enabled: false              # Apply color/format permissions to book & quill pages, applied at signing

# --------------------------------------------------
# MENTIONS
# --------------------------------------------------
mentions:
  enabled: true
  symbol: "@"                   # Character that prefixes a player name to trigger a mention
  case-sensitive: false         # When false, @Player and @player both resolve to the same target
  allow-self-mention: false     # Whether a player can mention themselves
  match-nicknames: false        # When true, @nickname resolves to the real player target

  format: "<yellow><hover:show_text:'<gray>Mentioned</gray>'>@%player_realname%</hover></yellow>"

  # Pings every online player, regardless of which channel they're in or radius
  everyone:
    enabled: true
    keyword: "everyone"          # Typed as <symbol><keyword>, e.g. @everyone
    format: "<gold><hover:show_text:'<gray>Mentioned everyone</gray>'>@everyone</hover></gold>"

  # Pings only the players who actually receive this specific message: the members of the
  # sender's channel if it's PRIVATE/RESTRICTED, or whoever's in radius/global range otherwise.
  here:
    enabled: true
    keyword: "here"               # Typed as <symbol><keyword>, e.g. @here
    format: "<gold><hover:show_text:'<gray>Mentioned everyone here</gray>'>@here</hover></gold>"

  components:
    # These components are all independent; any combination can be enabled
    chat:
      enabled: false
      text: "<yellow><gray>%player%</gray> just mentioned you</yellow>"

    sound:
      enabled: true
      key: "entity.experience_orb.pickup"
      volume: 0.8
      pitch: 2.0

    title:
      enabled: true
      text: "<gold><bold>Mentioned!</bold></gold>"
      fade-in: 10
      stay: 40
      fade-out: 10

    # Inherits timings from title
    subtitle:
      enabled: true
      text: "<yellow><gray>%player%</gray> mentioned you</yellow>"

    actionbar:
      enabled: false
      text: "<yellow><gray>%player%</gray> mentioned you</yellow>"

    bossbar:
      enabled: false
      text: "<yellow><gray>%player%</gray> mentioned you</yellow>"
      duration: 5
      color: RED
      overlay: PROGRESS
      countdown: true

# --------------------------------------------------
# URL FORMATTING
# --------------------------------------------------
urls:
  enabled: true                 # Detects raw URLs in chat and wraps them in a clickable MiniMessage component
  format: "<gold><click:open_url:'%url%'><hover:show_text:'<gray>Open link:</gray> <aqua>%url%</aqua>'>%url%</hover></click></gold>"

# --------------------------------------------------
# DISPLAY TAGS
# --------------------------------------------------
# Keywords players type anywhere in their message to insert an interactive component
# The trigger is replaced in-place with the rendered format
#
# Click event (to open GUI) requires version 1.21.7+ to work
display-tags:
  item:
    enabled: true
    triggers:
      - "[item]"
      - "[hand]"
    # case-sensitive: true
    format: "<gray>[<gold>x%amount% %item%</gold>]</gray>"
    gui: "display_tags/item"          # Set it to "" to disable GUI
    expires-after: 300                # Seconds the click stays valid
    expired-message: "<ref:prefix> <gray>You cannot longer preview this item."

  inventory:
    enabled: true
    triggers:
      - "[inv]"
    format: "<gray>[<gold><hover:show_text:'<gray>Click to view <white>%player%</white>\\'s inventory'><white>%player%</white>'s Inventory</hover></gold>]</gray>"
    gui: "display_tags/inventory"     # GUI is required
    expires-after: 300                # Seconds the click stays valid
    expired-message: "<ref:prefix> <gray>You cannot longer preview this inventory."

  enderchest:
    enabled: true
    triggers:
      - "[ec]"
    format: "<gray>[<gold><hover:show_text:'<gray>Click to view <white>%player%</white>\\'s ender chest'><white>%player%</white>'s Ender Chest</hover></gold>]</gray>"
    gui: "display_tags/enderchest"    # GUI is required
    expires-after: 300                # Seconds the click stays valid
    expired-message: "<ref:prefix> <gray>You cannot longer preview this inventory."

  shulker:
    enabled: true
    triggers:
      - "[shulker]"
      - "[box]"
    format: "<gray>[<gold><hover:show_text:'Click to view %item%\\'s contents'>%item%</hover></gold>]</gray>"
    gui: "display_tags/shulker"       # GUI is required
    expires-after: 300                # Seconds the click stays valid
    expired-message: "<ref:prefix> <gray>You cannot longer preview this shulker box."

#  # You can create your own display tags
#  balance:
#    triggers:
#      - "[bal]"
#      - "[balance]"
#    format: "<gray><hover:show_text:'<green>Balance: %aircore_economy_balance%</green>'>[%player%\\'s balance]</hover></gray>"
#
