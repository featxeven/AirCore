# --------------------------------------------------
# MODERATION
# --------------------------------------------------
moderation:
  # Two possible actions, only where a filter actually supports both:
  #   BLOCK   - Cancels the message and notifies the sender
  #   REPLACE - Rewrites the offending portion instead of cancelling
  #             (per filter, REPLACE means: caps -> lowercases the message,
  #              profanity -> substitutes matched words, unicode -> strips
  #              offending characters). Falls back to BLOCK automatically
  #              if a filter has nothing meaningful to rewrite.
  #
  # Every filter has its bypass permission: aircore.bypass.chat.filter.<filter-name>
  filters:
    caps:
      enabled: false
      threshold: 70               # Minimum % of alphabetic characters that must be uppercase to trigger
      min-length: 6               # Messages shorter than this are skipped entirely; avoids flagging short words like "OK"
      action: REPLACE             # REPLACE = convert the whole message to lowercase | BLOCK = cancel it

    spam:
      enabled: false
      window: 4                   # Sliding window in seconds; messages outside this window are forgotten
      max-messages: 3             # How many messages are allowed within one window before blocking
      similarity-check: true
      similarity-threshold: 80    # Levenshtein similarity %; two messages at or above this are treated as duplicates
      # Always BLOCKs

    advertising:
      enabled: false
      block-ips: true             # Detect bare IPv4/IPv6 addresses (e.g. 192.168.1.1, [::1])
      block-domains: true         # Detect plain domain patterns (e.g. play.rival.net)
      # Always BLOCKs

      # Java regex patterns that actively flag a message as advertising
      # Evaluated only after the whitelist passes; a whitelist match will always cancel evaluation
      patterns:
        - "(?i)discord\\.gg/[a-zA-Z0-9]+"
        - "(?i)(play|join)\\s*\\.?\\s*[a-z0-9-]+\\s*\\.\\s*(net|com|org|gg)"

      whitelist:
        # Whitelist is evaluated before any detection logic; a match here always lets the message through
        # Each entry can be either a plain word (case-insensitive) or a Java regex pattern.
        - "yourserver.net"
        - "store.yourserver.net"
        - "(?i)yourserver\\.net(/\\S*)?"
        - "(?i)(store|wiki)\\.yourserver\\.net"

    profanity:
      enabled: false
      words-file: "data/profanity.txt"  # One entry per line; plain words and Java regex are both supported
      action: REPLACE
      replacement: "*"                  # String each matched letter is substituted with when action is REPLACE

    unicode:
      # Targets characters that have no readable value in chat but are commonly used to bypass other filters:
      #   Zalgo / glitch text  >  h̷̤͑e̷͕͒l̷̰͝l̴̰̈́o̸̳͝
      #   Zero-width joiners, soft hyphens, and other invisible codepoints
      #   Characters far outside standard latin ranges
      enabled: false
      allow-latin-extended: true        # When true, accented characters like é, ñ, and ü are never touched
      action: REPLACE                   # REPLACE = silently strip offending characters, message still sends | BLOCK = cancel it

  # A step-by-step escalation ladder: each flagged message adds to a player's count, and reaching a
  # threshold below fires that step.
  #
  # Bypass: aircore.bypass.chat.warnings
  warnings:
    enabled: false
    reset-after: 600               # Seconds since the last violation before the count resets; -1 = never
    max-count: -1                  # Hard ceiling on the count; -1 = unlimited
    count-replacements: true       # Whether REPLACE-action filters count towards the ladder too

    # Added to a player's count when that filter flags a message. Unlisted filters
    # default to 1; 0 excludes a filter from the ladder without disabling it.
    weights:
      caps: 1
      spam: 0
      advertising: 3
      profanity: 2
      unicode: 1

    repeat-last-step: 0            # Re-fire the highest step every this-many further violations; 0 = don't repeat

    steps:
      3:
        message:
          - "<ref:prefix> <red>Warning <white>%step%/%total_steps%</white>: please follow the chat rules."

      5:
        message:
          - "<ref:prefix> <red>Final warning <white>(%step%/%total_steps%)</white> - next violation will mute you."
          - "<sound:block.note_block.didgeridoo:1:0.5>"

      7:
        command:
          - "mute %player% 10m Repeated chat rule violations"
        notify-staff:
          - "<ref:prefix> <yellow>%player% <gray>reached step <white>%step%/%total_steps%</white> <dark_gray>(<white>%count%</white> points)<dark_gray>."

      10:
        command:
          - "kick %player% Repeated chat rule violations"
        reset-on-trigger: true
        notify-staff:
          - "<ref:prefix> <yellow>%player% <gray>was auto-kicked at step <white>%step%/%total_steps%</white> <dark_gray>(<white>%count%</white> points)<dark_gray>."

# --------------------------------------------------
# PRIVATE MESSAGES
# --------------------------------------------------
private-messages:
  # Private messaging is controlled in-game via commands, not from this file.
  # To disable /msg, /reply, and /socialspy, disable the commands in commands.yml instead.

  # --- Behavior ---
  allow-self-message: false
  reply-expires-after: 60           # Seconds before the stored /reply target is discarded; -1 = keep indefinitely

  # --- Pipeline ---
  # Each toggle controls whether that processing step also runs inside private messages
  apply-cooldown: false             # Use the cooldown from general.cooldown (or slow-mode if active)
  apply-url-formatting: true        # Wrap URLs with the format defined in urls.format
  apply-display-tags: true          # Resolve display tags defined in display-tags
  apply-filters: false              # Run the full filter pipeline; caps, spam, profanity, etc.