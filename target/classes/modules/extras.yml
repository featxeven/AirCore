# AirCore - modules/extras
# Docs: https://airdevelopment.gitbook.io/docs/

# When set to false, the entire extras module is disabled.
# Only turn this off if you want to handle join/leave/death events with a different plugin entirely.
#
# You may still need to manually disable certain commands related to this module (in commands.yml).
enabled: true

# --------------------------------------------------
# JOIN
# --------------------------------------------------
join:
  enabled: true

  # --- MOTD ---
  # Sent privately to the joining player.
  # first-join fires only on a player's very first connection.
  # returning uses per-group entries; _DEFAULT_ applies when no group matches.
  motd:
    first-join:
      - " "
      - "<green>Welcome <yellow>%player%</yellow> to the server!"
      - "<gray>Type <white>/help</white> to get started."
      - " "

    returning:
      _DEFAULT_:
        - " "
        - "<green>Welcome back, <yellow>%player%</yellow>!"
        - " "

  # --- Broadcast ---
  # Sent to all online players.
  # first-join is a single message; returning supports per-group entries.
  broadcast:
    first-join: "<yellow>%player% <gray>joined for the first time! <dark_gray>(Member <yellow>#%join_number%<dark_gray>)"

    returning:
      _DEFAULT_: "<gray>[<green>+<gray>] <white>%player%</white> joined the game."
      # vip: "<gray>[<green>+<gray>] <dark_green><bold>VIP</bold> <green>%player% <gray>joined the game."

# --------------------------------------------------
# LEAVE
# --------------------------------------------------
leave:
  enabled: true

  # --- Broadcast ---
  # Sent to all online players when a player disconnects. Supports PlaceholderAPI.
  # _DEFAULT_ is used when the player's group has no entry here.
  broadcast:

    _DEFAULT_: "<gray>[<red>-<gray>] <white>%player%</white> left the game."
    # vip: "<gray>[<red>-<gray>] <dark_green><bold>VIP</bold> <green>%player% <gray>left the game."

# --------------------------------------------------
# DEATH
# --------------------------------------------------
death:
  # When false, vanilla death messages are used instead.
  enabled: true

  disabled-worlds: []
  # - "disabled_world"     # Worlds where vanilla death messages are used instead

# --------------------------------------------------
# AFK
# --------------------------------------------------
afk:
  # Afk command is controlled in-game, not from this file.
  # To disable it, disable the command in commands.yml instead.

  broadcast: true              # Announce to everyone when a player becomes/stops being AFK.
  idle-timeout: -1             # Seconds without activity before a player is automatically marked AFK; -1 = disabled
  # Bypass with aircore.bypass.afk.idle

  # --- Activity ---
  # What counts as a player being active: any enabled trigger ends AFK and resets the idle-timeout timer.
  activity:
    move: true                  # Changing position
    move-threshold: 0.15        # How many blocks of movement count as activity
    look: true                  # Turning the camera (cursor movement)
    look-threshold: 10          # How many degrees of rotation count as activity
    interact: true              # Block or entity interaction
    inventory: true             # Clicking inside an inventory
    chat: true                  # Sending a public chat message
    command: true               # Running a command (/afk itself never counts)

  # --- Reason ---
  # A reason players can attach when going AFK, e.g. "/afk cooking dinner".
  reason:
    enabled: true
    max-length: 100                  # -1 = unlimited

    # AFK reasons matching any of these patterns are never allowed.
    # Each entry can be a plain word or a Java regex pattern.
    blacklist: []
    # - "brb"                        # plain text; blocks the word "brb" appearing anywhere
    # - "(?i)a[d@][m][i1][n]+"       # regex; blocks admin, 4dmin, adm1n, @dmin, etc. anywhere in the reason

    extend-profanity-words: false    # Extends filters.profanity words file (from the chat module) to reason validation.

  # --- Notify ---
  # Lets a player who interacts with someone AFK know they may not respond.
  notify:
    enabled: true
    cooldown: 30            # Seconds before the same player is told again about the same AFK
    # target, across every action below combined; -1 = always show

    actions:
      private-messages: true        # /msg, /reply
      mentions: true                # @player mentions in chat
      teleport-requests: true       # /tpa, /tpahere
      payments: true                # /pay

  # --- Actions-after ---
  # Runs one or more actions once a player has been continuously AFK for the given number of seconds.
  # Bypass with aircore.bypass.afk.actions
  #
  # Placeholders available inside 'commands': %player%, %duration%, %duration_raw%, %reason%
  actions-after: []
    # - seconds: 120
    #   chat: "<ref:prefix> <gray>You've been AFK for 2 minutes."
    #
    # - seconds: 300
    #   title:
    #     text: "<red><bold>STILL THERE?"
    #     fade-in: 10
    #     stay: 60
    #     fade-out: 10
    #   subtitle: "<gray>You will be kicked soon."
    #   sound:
    #     key: "block.note_block.pling"
    #     volume: 1.0
    #     pitch: 1.0
    #
    # - seconds: 600
    #   conditions:
    #     - "%server_online% >= 50"    # optional, e.g. only kick while the server is busy
    #   command:
    #     run-as: CONSOLE
    #     command: "kick %player% You have been kicked for being AFK too long."

# --------------------------------------------------
# NICKNAMES
# --------------------------------------------------
nicknames:
  # Nickname command is controlled in-game, not from this file.
  # To disable it, disable the command in commands.yml instead.

  prefix: "<gray>~</gray>"             # Shown before the nickname in chat to distinguish it from a real username; "" = none
  max-length: 16
  validation-regex: "^[a-zA-Z0-9_]+$"  # Names not matching this pattern are rejected

  # Nicknames matching any of these patterns are never allowed.
  # Useful for blocking impersonation of staff titles or reserved names.
  #
  # Blacklist is checked after validation-regex passes, so entries only need to
  # account for characters that validation-regex already allows.
  #
  # Each entry can be either a plain word or a Java regex pattern.
  blacklist: []
  # - "console"                      # plain text; blocks exactly "console" (case-insensitive)
  # - "(?i)a[d@][m][i1][n]+"         # regex; blocks admin, 4dmin, adm1n, @dmin, etc.

  extend-profanity-words: false      # Extend filters.profanity words file to the blacklist (from chat module)

# --------------------------------------------------
# BLOCK
# --------------------------------------------------
block:
  # Block/unblock commands are controlled in-game, not from this file.
  # To disable it, disable the command in commands.yml instead.

  max-blocked: 20              # Maximum number of players a player can block; -1 = unlimited

  actions:
    chat: true                 # Hide public chat messages
    private-messages: true     # Block /msg and /reply
    mentions: true             # Suppress @ mentions
    teleport-requests: true    # Block /tpa and /tpahere
    payments: false            # Block /pay