# AirCore - Main Configuration
# Docs: https://airdevelopment.gitbook.io/docs/
#
# This file controls global plugin behavior only.
# Module-specific settings live in their own files under modules/.

# --------------------------------------------------
# GENERAL
# --------------------------------------------------
general:
  # Language files
  lang: "en_US"                      # File name under lang/messages/<KEY>.yml
  items-lang: "en_US"                # File name under lang/items/<KEY>.yml

  # Command settings
  strict-args: true                  # Show an error if extra arguments are passed to a command
  allow-nickname-lookup: true        # Allow [player] arguments to match nicknames, not just real names

  # Notifications & Feedback
  notify-updates: true               # Notify admins on join when a new plugin version is available
  console-feedback: true             # Send feedback to target players when console executes commands on them

# --------------------------------------------------
# FORMATTING
# --------------------------------------------------
# How MiniMessage / legacy codes are interpreted in player message values.
formatting:
  # MINI    - MiniMessage only  (<red>, <#FFFFFF>, <bold>, etc.)
  # LEGACY  - Legacy codes only (&c, &#FFFFFF, &l, etc.)
  # SMART   - Auto-detect per message (accepts both)
  message-format: SMART

  # How durations are displayed in placeholders.
  # DETAILED    - "2 days 3 hours 4 minutes"
  # SEQUENTIAL  - One unit at a time, largest first
  # CUSTOM      - Up to <granularity> units
  duration:
    mode: CUSTOM
    granularity: 2    # 1 = only the largest unit, 4 = full breakdown

  # Time pattern used in placeholders.
  # HH:mm          -> 14:05
  # hh:mm a        -> 02:05 PM
  time: "HH:mm"

  # Date pattern used in placeholders.
  # dd/MM/yy       -> 08/03/26
  # dd MMM         -> 08 Mar
  # MMMM dd, yyyy  -> March 08, 2026
  # E, dd MMM      -> Sun, 08 Mar
  date: "dd/MM/yy"

  # Zone both 'clock' and 'date' above are computed against, so timestamps
  # stay consistent regardless of the JVM's default zone.
  # Use a valid IANA zone id (https://timeapi.io/documentation/iana-timezones),
  # or "system" to use the JVM's default zone.
  timezone: "system"

# --------------------------------------------------
# TOGGLE DEFAULTS
# --------------------------------------------------
# Default toggle states applied to players on their first join.
toggle-defaults:
  # If you disable a toggle here (e.g. payconfirmtoggle), consider also disabling its
  # corresponding toggle option in commands.yml to prevent players from changing it.

  # --- Chat ---
  msgtoggle: true               # Allows receiving private messages
  socialspy: false              # Toggles viewing private messages of other players
  chattoggle: true              # Allows receiving public chat messages
  mentiontoggle: true           # Allows receiving mention notifications
  announcetoggle: true          # Allows receiving server broadcasts

  # --- Economy ---
  paytoggle: true               # Allows receiving payments from other players
  payconfirmtoggle: true        # Requires confirmation before sending payments

  # --- Teleport ---
  tptoggle: true                # Allows receiving teleport requests
  tpautoaccept: false           # Automatically accepts incoming teleport requests
  tpconfirmtoggle: true         # Requires confirmation before sending teleport requests

# --------------------------------------------------
# WORLD RESTRICTIONS
# --------------------------------------------------
# Prevents certain player features from being active in specific worlds
# Re-applied automatically whenever a player's state is (re)synced.
world-restrictions:
# Available features:
#   GOD              - Disables god mode (/god)
#   FLY              - Disables flight (/fly)
#   SPEED            - Resets walk/fly speed to default, ignoring /speed
#   CUSTOM_TIME      - Ignores a personal time set via /playertime
#   CUSTOM_WEATHER   - Ignores personal weather set via /playerweather
#   AFK              - Disables AFK (/afk and idle-timeout), and ends it on entering the world
#
# example_arena:
#   - GOD
#   - FLY
#   - SPEED
#
# Bypass with aircore.bypass.restriction.<feature>