name: AirCore
main: com.ftxeven.aircore.AirCore
version: 2.0.0
api-version: '1.21'
author: ftxeven
description: A modern, modular core plugin focused on performance, flexibility, and customization.
folia-supported: true

softdepend:
  - Vault
  - PlaceholderAPI
  - Nexo
  - ItemsAdder
  - CraftEngine

commands:
  aircore:
    description: Plugin management command.
    aliases: []
    usage: /aircore reload|open|version|migrate|variable|announcement|placeholder
    permission: aircore.admin

permissions:
  aircore.admin:
    description: Grants all AirCore permissions.
    default: op
    children:
      aircore.command.*: true
      aircore.bypass.*: true
      aircore.access.*: true

  # --- Commands ---

  # Chat
  aircore.command.channel:
    description: Use /channel.
    default: op
  aircore.command.channel.others:
    description: Move another player to a channel.
    default: op
  aircore.command.channel.all:
    description: Move everyone to a channel.
    default: op
  aircore.command.msg:
    description: Use /msg.
    default: op
  aircore.command.msg.all:
    description: Message everyone.
    default: op
  aircore.command.reply:
    description: Use /reply.
    default: op
  aircore.command.msgtoggle:
    description: Toggle private messages.
    default: op
  aircore.command.msgtoggle.others:
    description: Toggle private messages for others.
    default: op
  aircore.command.socialspy:
    description: Toggle Social Spy.
    default: op
  aircore.command.socialspy.others:
    description: Toggle Social Spy for others.
    default: op
  aircore.command.chattoggle:
    description: Toggle chat.
    default: op
  aircore.command.chattoggle.others:
    description: Toggle chat for others.
    default: op
  aircore.command.mentiontoggle:
    description: Toggle mentions.
    default: op
  aircore.command.mentiontoggle.others:
    description: Toggle mentions for others.
    default: op
  aircore.command.announcetoggle:
    description: Toggle periodic announcements.
    default: op
  aircore.command.announcetoggle.others:
    description: Toggle periodic announcements for others.
    default: op
  aircore.command.broadcast:
    description: Use /broadcast.
    default: op

  # Economy
  aircore.command.balance:
    description: Check your balance.
    default: op
  aircore.command.balance.others:
    description: Check others' balance.
    default: op
  aircore.command.baltop:
    description: Use /baltop.
    default: op
  aircore.command.pay:
    description: Use /pay.
    default: op
  aircore.command.paytoggle:
    description: Toggle payments.
    default: op
  aircore.command.paytoggle.others:
    description: Toggle payments for others.
    default: op
  aircore.command.payconfirmtoggle:
    description: Toggle payment confirmation prompts.
    default: op
  aircore.command.payconfirmtoggle.others:
    description: Toggle payment confirmation prompts for others.
    default: op
  aircore.command.economy:
    description: Use /economy.
    default: op
  aircore.command.economy.give:
    description: Give balance to a specific player.
    default: op
  aircore.command.economy.give.all:
    description: Give balance to all online players.
    default: op
  aircore.command.economy.give.server:
    description: Give balance to all players.
    default: op
  aircore.command.economy.take:
    description: Take balance from a specific player.
    default: op
  aircore.command.economy.take.all:
    description: Take balance from all online players.
    default: op
  aircore.command.economy.take.server:
    description: Take balance from all players.
    default: op
  aircore.command.economy.set:
    description: Set balance for a specific player.
    default: op
  aircore.command.economy.set.all:
    description: Set balance for all online players.
    default: op
  aircore.command.economy.set.server:
    description: Set balance for all players.
    default: op
  aircore.command.economy.reset:
    description: Reset balance for a specific player.
    default: op
  aircore.command.economy.reset.all:
    description: Reset balance for all online players.
    default: op
  aircore.command.economy.reset.server:
    description: Reset balance for all players.
    default: op
  aircore.command.economy.*:
    description: Grants access to all /economy sub-commands.
    default: op
    children:
      aircore.command.economy: true
      aircore.command.economy.give: true
      aircore.command.economy.give.all: true
      aircore.command.economy.give.server: true
      aircore.command.economy.take: true
      aircore.command.economy.take.all: true
      aircore.command.economy.take.server: true
      aircore.command.economy.set: true
      aircore.command.economy.set.all: true
      aircore.command.economy.set.server: true
      aircore.command.economy.reset: true
      aircore.command.economy.reset.all: true
      aircore.command.economy.reset.server: true
  aircore.command.sell:
    description: Use /sell.
    default: op

