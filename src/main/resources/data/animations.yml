# AirCore - Animations Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# Define reusable text animations here, then reference them anywhere
# MiniMessage text is used (messages, titles, actionbars, bossbars, etc.) with:
#   <anim:key>  |  <a:key> (shorthand)
#
# 'interval' is in ticks (20 ticks = 1 second). Frames loop in order.

animations:

  rainbow:
    interval: 5
    mode: RANDOM
    frames:
      - "<red>"
      - "<gold>"
      - "<yellow>"
      - "<green>"
      - "<aqua>"
      - "<light_purple>"

  loading_dots:
    interval: 10
    mode: LOOP
    frames:
      - "Loading"
      - "Loading."
      - "Loading.."
      - "Loading..."

  aircore_wave:
    interval: 4
    mode: PING_PONG
    frames:
      - "<white>A</white><gray>ircore</gray>"
      - "<gray>A</gray><white>i</white><gray>rcore</gray>"
      - "<gray>Ai</gray><white>r</white><gray>core</gray>"
      - "<gray>Air</gray><white>c</white><gray>ore</gray>"
      - "<gray>Airc</gray><white>o</white><gray>re</gray>"
      - "<gray>Airco</gray><white>r</white><gray>e</gray>"
      - "<gray>Aircor</gray><white>e</white>"