# AirCore - economy/sell/confirm_selected.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the sell logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: sell-confirm

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Selected</bold></gradient>"
  rows: 3

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-8, 18-26]

  confirm:
    slots: 11
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Confirm</bold>"
    lore:
      - "<gray>Click to confirm and sell the selected"
      - "<gray>items for %worth%."
      - " "
      - "<gray>Tax: <red>%tax_plain%"
    actions:
      any:
        - "[item] type:sell scope:selected"
        - "=can:sell [sound] $success"
        - "[open] context:true"

  cancel:
    template: cancel-button
    slots: 15