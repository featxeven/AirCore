# AirCore - economy/sell/sell.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own;
# to disable this GUI, remove its GUI entry from commands.yml

# 'role' binds this file to the sell logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: sell

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Selling Menu</bold></gradient>"
  rows: 6
  force-reopen: false
  refresh-interval: 20 # For placeholders to update

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slot where the player can place items to sell.
  sell-slots: [0-44]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [45-47, 49, 51-52]

  confirm-selected:
    slots: 48
    material: MINECART
    display-name: "<green><bold>Confirm selected</bold>"
    lore:
      - "<gray>Click to confirm and sell the selected"
      - "<gray>items for %worth%."
      - " "
      - "<gray>Tax: <red>%tax_plain%"
    actions:
      any:
        - "[item] type:sell scope:selected gui:economy/sell/confirm_selected"
        - "=can:sell [sound] $click"

  confirm-all:
    slots: 50
    material: CHEST_MINECART
    display-name: "<green><bold>Confirm all</bold>"
    lore:
      - "<gray>Click to confirm and sell everything"
      - "<gray>for %worth_all%."
      - " "
      - "<gray>Tax: <red>%tax_all_plain%"
    actions:
      any:
        - "[item] type:sell scope:all gui:economy/sell/confirm_all"
        - "=can:sell_all [sound] $click"

  close:
    template: close-button
    slots: 53