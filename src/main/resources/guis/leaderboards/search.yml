# AirCore - leaderboards/search.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# Searches the board of the GUI that opened it. One search screen can serve every leaderboard. To give a board
# its own search screen, copy this file and point that board's [search] at it with 'gui:<id>'.

# 'role' binds this file to the leaderboard logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: leaderboards-search

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Search</bold></gradient> <dark_gray>- <gray>%query% <dark_gray>- <gray>Page %page%/%pages%"
  rows: 6

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slots where ranked entries are rendered.
  entry-slots: [9-44]

  # How each ranked player is rendered inside entry-slots.
  # The base look is the 'leaderboards-entry' template in shared.yml, any field declared here replaces it.
  entry:
    template: leaderboards-entry

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-3, 5-8, 46-47, 51-52]

  # --- Header ---
  back:
    template: back-button
    slots: 0

  header:
    slots: 4
    material: COMPASS
    display-name: "<gradient:#5AD1F2:#736EFE><bold>Search</bold></gradient>"
    lore:
      - "<dark_gray>Leaderboard"
      - " "
      - " <dark_gray>- <gray>Looking for: <white>%query%"
      - " <dark_gray>- <gray>Matches: <white>%current%<dark_gray>/<white>%total%"

  no-entries:
    template: leaderboards-no-entries
    slots: 22

  # --- Footer ---
  previous-page:
    template: previous-page
    slots: 45

  next-page:
    template: next-page
    slots: 53

  search:
    template: search-button
    slots: 48
    actions:
      any:
        - "[sound] $click"
        - "[search] type:leaderboard page:1"

  info:
    template: leaderboards-info
    slots: 49

  close:
    template: close-button
    slots: 50

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI triggered the overlay.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
