# AirCore - display_tags/enderchest.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the display-tags logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: display-tag-enderchest

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Ender Chest</bold></gradient> <dark_gray>- <white><gray>%target%</gray>'s Ender Chest"
  rows: 5

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slots where the previewed contents is placed.
  enderchest-slots: [9-35]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-3, 5-8, 36-44]

  target-head:
    slots: 4
    material: head-%target_realname%
    display-name: "<white>%target%<gray>'s Ender Chest"