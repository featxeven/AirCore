# AirCore - kits/confirm_claim.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own;
# to disable this GUI, remove its GUI entry from commands.yml

# No 'role' here - this GUI is plain config (static items only), so rename or restructure
# it however you like.

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Claim Kit</bold></gradient>"
  rows: 3

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-8, 18-26]

  confirm:
    slots: 11
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Confirm</bold>"
    lore:
      - "<gray>Click to confirm and claim this kit."
    actions:
      any:
        # Note:
        #   flat [claim] type:kit action expects a "kit" context value to work.
        - "[claim] type:kit"
        - "=can:claim_kit:%kit% [sound] $success"
        - "[open] context:true"
    priority:
      # No screen to return to when this GUI was opened directly (e.g. /kit <kitname>)
      - conditions:
          - "%previous_gui% == null"
        actions:
          any:
            - "[claim] type:kit"
            - "=can:claim_kit:%kit% [sound] $success"
            - "[close]"

  back:
    slots: 15
    material: RED_STAINED_GLASS_PANE
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to the previous menu."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $click"
    priority:
      # No screen to return to when this GUI was opened directly (e.g. /kit <kitname>)
      - conditions:
          - "%previous_gui% == null"
        template: close-button