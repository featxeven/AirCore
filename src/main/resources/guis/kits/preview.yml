# AirCore - kits/preview.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the kit-preview logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: kits-preview

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Kit Preview</bold></gradient>"
  rows: 6

# --------------------------------------------------
# LAYOUT
# Controls how kit is displayed.
# --------------------------------------------------
layout:
  # Slot where the kit contents is placed.
  #
  # Note:
  #   preview-slots expects a "kit" context value.
  preview-slots: [9-44]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-8, 45-53]

  back:
    slots: 0
    material: DARK_OAK_DOOR
    display-name: "<white><bold>Back</bold>"
    lore:
      - "<gray>Return to the previous menu."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $click"