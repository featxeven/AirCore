# AirCore - input/dialog.yml Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# This input type requires version 1.21.6+ to work.

# -----------------------------------------------
# GLOBAL
# Applies to all contexts unless overridden.
# -----------------------------------------------
on-cancel: BACK   # BACK = reopen previous GUI | CLOSE = do nothing

# -----------------------------------------------
# CONTEXTS
# Each action that opens a dialog input names a context.
# on-cancel can be overridden per context.
# -----------------------------------------------
contexts:
  homes:
    search:
      # on-cancel: CLOSE
      title: "Search"
      external-title: "AirCore"
      width: 200
      can-close: true

      body:
        entries:
          - type: text
            text: "Type a query to search for homes."
          # - type: item
          #   material: COMPASS
          #   description: "<gray>e.g. MyHome"
          #   description-width: 150
          #   show-tooltip: true
          #   width: 16
          #   height: 16

      input:
        label: "Home name"
        label-visible: true
        initial-value: ""
        max-length: 16  # -1 (or omitted) = unlimited
        width: 150

      buttons:
        submit:
          text: "<green>Search"
          width: 100
        cancel:
          text: "<red>Cancel"
          width: 100

  leaderboards:
    search:
      # on-cancel: CLOSE
      title: "Search"
      external-title: "AirCore"
      width: 200
      can-close: true

      body:
        entries:
          - type: text
            text: "Type a query to search for a player."

      input:
        label: "Player name"
        label-visible: true
        initial-value: ""
        max-length: 16
        width: 150

      buttons:
        submit:
          text: "<green>Search"
          width: 100
        cancel:
          text: "<red>Cancel"
          width: 100