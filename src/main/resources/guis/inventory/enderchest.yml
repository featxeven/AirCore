# AirCore - inventory/enderchest.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# Note:
#   Keep the default configuration unchanged to match the vanilla Ender Chest GUI when opened.

# 'role' binds this file to the inventory logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: inventory-enderchest

settings:
  # MiniMessage <lang> tag: automatically uses the player's locale.
  title: "<lang:block.minecraft.ender_chest>"
  rows: 3

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slot where the player can place items.
  enderchest-slots: [0-26]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items: []