# AirCore - inventory/disposal/disposal.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# 'role' binds this file to the disposal logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: disposal

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Disposal</bold></gradient>"
  rows: 6
  force-reopen: false
  refresh-interval: 20 # For placeholders to update

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  # Slot where the player can place items to dispose.
  disposal-slots: [0-44]

# --------------------------------------------------
# ITEMS
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [45-47, 49, 51-52]

  confirm-selected:
    slots: 48
    material: MINECART
    display-name: "<red><bold>Confirm selected</bold>"
    lore:
      - "<gray>Click to dispose <white>%amount%</white> item(s)."
    actions:
      any:
        - "[item] type:disposal scope:selected gui:inventory/disposal/confirm_selected"
        - "=can:dispose [sound] $click"

  confirm-all:
    slots: 50
    material: CHEST_MINECART
    display-name: "<red><bold>Confirm all</bold>"
    lore:
      - "<gray>Click to dispose everything (<white>%amount_all%</white> items)."
    actions:
      any:
        - "[item] type:disposal scope:all gui:inventory/disposal/confirm_all"
        - "=can:dispose_all [sound] $click"

  close:
    template: close-button
    slots: 53