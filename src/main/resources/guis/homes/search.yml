# AirCore - homes/search.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# This is an example GUI. You can safely delete it and create your own.

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that opened the search (e.g. homes/target).

# 'role' binds this file to the home-browsing logic. Rename/relocate this file freely,
# just keep the 'role:' line.
role: homes-search

settings:
  title: "<gradient:#5AD1F2:#736EFE><bold>Search</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"
  rows: 5

# --------------------------------------------------
# LAYOUT
# --------------------------------------------------
layout:
  filters:
    # Filters excluded from this GUI.
    excluded: [] # world, icon

    format:
      world: # %filter_WORLD_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"
      icon: # %filter_ICON_list%
        selected: "<aqua>> <white>%name% <gray>(%count%)"
        unselected: "<dark_gray>  %name% <gray>(%count%)"

  sorts:
    # Sort options excluded from this GUI.
    excluded: [] # home

    format:
      home: # %sort_HOME_list%
        selected: "<aqua>> <white>%name%"
        unselected: "<dark_gray>  %name%"

  # Slots where matching homes are rendered.
  home-slots: [9-35]

  # How each home is rendered inside home-slots.

  # Material/display-name/lore/... per icon are defined in data/ > filter.yml
  # (homes > icon > <id> > home). This is the base home item configuration.
  home:
    material: GRASS_BLOCK
    display-name: "<white>Home: <gradient:#5AD1F2:#736EFE><bold>%home%"
    lore:
      - "=is:favorite_home  "
      - "=is:owned_home =is:favorite_home <yellow>You set this home as favorite."
      - "!=is:owned_home =is:favorite_home <yellow><white>%target%</white> set this home as favorite."
      - " "
      - " <dark_gray>- <gray>World: <white>%world%"
      - " <dark_gray>- <gray>Created on: <white>%date% %time%"
      - " <dark_gray>- <gray>Coords: <white>%x% %y% %z%"
      - "!=is:selected_icon:all  <dark_gray>- <gray>Icon: <white>%icon%"
      - "=is:bundled_icon  "
      - "=is:bundled_icon  <dark_gray>- <gray>Bundle: <white>%bundle%"
      - " "
      - "<green>Left-Click <gray>to teleport"
      - "=has:aircore.command.deletehome <red>Right-Click <gray>to delete"
    actions:
      left:
        # You can include gui:... param if you want to add a 'confirm' GUI before teleporting.
        # Requires role: homes-confirm
        - "[teleport] type:home id:%home%"
        - "=is:valid_home [sound] $success"
        - "=is:valid_home [close]"
      right:
        - "=has:aircore.command.deletehome [delete] type:home gui:homes/confirm_delete id:%home%"
        - "=has:aircore.command.deletehome =is:valid_home [sound] $click"

# --------------------------------------------------
# ITEMS (base - used when no context overrides items)
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [1-2, 4, 6-8, 37-38, 42-43]

  no-homes:
    template: homes-no-homes
    slots: 22

  # --- Header ---
  back:
    template: back-button
    slots: 0

  filter-worlds:
    template: homes-filter-world
    slots: 3

  filter-icons:
    template: homes-filter-icon
    slots: 5

    # --- Footer ---
  previous-page:
    template: previous-page
    slots: 36

  next-page:
    template: next-page
    slots: 44

  info:
    template: homes-info
    slots: 40

  search:
    template: search-button
    slots: 39
    actions:
      any:
        - "[sound] $click"
        - "[search] type:home page:1 target:current restore:<page:current>"

  sort-homes:
    template: homes-sort
    slots: 41

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI opened the search.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  homes/player:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Your Homes</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    # The rest is inherited from the base config above unless overridden here.

  homes/target:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>%target%'s Homes</bold></gradient> <dark_gray>- <white>\"%query%\" <dark_gray>(%page%/%pages%)"

    layout:
      home:
        material: GRASS_BLOCK
        display-name: "<white>Home: <gradient:#5AD1F2:#736EFE><bold>%home%"
        lore:
          - "=is:favorite_home  "
          - "=is:favorite_home <yellow><white>%target%</white> set this home as favorite."
          - " "
          - " <dark_gray>- <gray>World: <white>%world%"
          - " <dark_gray>- <gray>Created on: <white>%date% %time%"
          - " <dark_gray>- <gray>Coords: <white>%x% %y% %z%"
          - "!=is:selected_icon:all  <dark_gray>- <gray>Icon: <white>%icon%"
          - "=is:bundled_icon  "
          - "=is:bundled_icon  <dark_gray>- <gray>Bundle: <white>%bundle%"
          - " "
          - "=has:aircore.command.playerhome.teleport <green>Left-Click <gray>to teleport"
          - "=has:aircore.command.playerhome.delete <red>Right-Click <gray>to delete"
        actions:
          left:
            - "=has:aircore.command.playerhome.teleport [teleport] type:home id:%home%"
            - "=has:aircore.command.playerhome.teleport =is:valid_home [sound] $success"
            - "=has:aircore.command.playerhome.teleport =is:valid_home [close]"
          right:
            - "=has:aircore.command.playerhome.delete [delete] type:home gui:homes/confirm_delete id:%home%"
            - "=has:aircore.command.playerhome.delete =is:valid_home [sound] $click"