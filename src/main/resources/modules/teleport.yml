# AirCore - modules/teleport
# Docs: https://airdevelopment.gitbook.io/docs/

# Teleporting is controlled in-game via commands, not from this file.
# To disable it, disable the commands in commands.yml instead.

# --------------------------------------------------
# GENERAL
# --------------------------------------------------
general:
  teleport-to-center: true      # Snap players to the center of a block on arrival
  safe-landing: false           # Find the nearest safe block if the arrival point is inside a wall or in the air
  safe-landing-radius: 8        # Maximum search radius in blocks before cancelling the teleport
  disabled-worlds: []
  # - "disabled_world"          # Teleportation is fully disabled in these worlds
                                # Bypass: aircore.bypass.teleport.disabled-worlds.general

  # Teleport types that skip the restrictions below entirely: the disabled-worlds check, the
  # safe-landing search, and the countdown.
  #
  # Available types: TP, TPHERE, TPPOS, TPOFFLINE, TPA, TPAHERE, HOME, WARP, SPAWN, BACK
  restriction-exempt-types:
    - TP
    - TPHERE
    - TPPOS
    - TPOFFLINE
    # - TPA
    # - TPAHERE
    # - HOME
    # - WARP
    # - SPAWN
    # - BACK

# --------------------------------------------------
# COUNTDOWN
# --------------------------------------------------
countdown:
  duration: 5                   # Seconds before the teleport executes; 0 = instant
  repeat-message: true          # Send a countdown message each second while waiting

  # Cancel the teleport if the player does any of the following while waiting
  cancel-on:
    move: true
    move-threshold: 0.15        # How many blocks of movement trigger a cancel
    damage: true
    command: false
    interact: false             # Block or entity interaction

  # Overrides the countdown duration for specific worlds and/or teleport types.
  # Evaluated top to bottom - the first entry whose 'worlds' and 'types' both match
  # (or are omitted/empty, meaning "any") wins. Types: TPA, TPAHERE, HOME, WARP, SPAWN, BACK
  overrides: []
  # - types: [SPAWN, BACK]
  #   duration: 3
  #
  # - worlds: [creative]
  #   duration: 0                # applies to every type in this world
  #
  # - worlds: [event_arena]
  #   types: [WARP, SPAWN]
  #   duration: 0

# --------------------------------------------------
# POST-TELEPORT
# --------------------------------------------------
post-teleport:
  immunity-duration: 3          # Seconds of damage immunity granted after arrival; -1 = disabled

# --------------------------------------------------
# REQUESTS (TPA)
# --------------------------------------------------
requests:
  require-confirmation: true    # Requires confirmation before sending requests.
  confirmation-timeout: 60      # Seconds the player has to re-run the command to confirm
  cooldown: 20                  # Seconds before a player can send another request to the same player (or everyone)
  expire-after: 60              # Seconds before an unanswered request is automatically canceled. -1 = never
  retain-on-logout: false       # Keep a pending request alive if the sender or target logs out
  max-pending: 5                # Maximum incoming requests a player can have at once; -1 = unlimited

# --------------------------------------------------
# SPAWN
# --------------------------------------------------
spawn:
  on-join: false                # Teleport all players to spawn every time they join
  on-death: true                # Teleport players to spawn after dying

  # Set spawn locations in-game:
  #   /setspawn                           - sets the default spawn
  #   /setspawn -first_join:<true/false>  - sets the first join spawn
  #   /setspawn -group:<group>            - sets a spawn for a specific group

# --------------------------------------------------
# WARPS
# --------------------------------------------------
warps:
  disabled-worlds: []
    # - "disabled_world"          # Warps cannot be used in these worlds
                                  # Bypass: aircore.bypass.teleport.disabled-worlds.warp

# --------------------------------------------------
# RESPAWN
# --------------------------------------------------
respawn:
  prefer-bed: false             # Respawn at bed if set
  prefer-anchor: true           # Respawn at respawn anchor if charged
  # Falls back to spawn if neither is set nor both are obstructed

# --------------------------------------------------
# BACK
# --------------------------------------------------
back:
  notify-on-death: true         # Let a player know they can use /back after they die (requires aircore.command.back)
  max-history: 3                # How many locations back a player can step through; 1 = only the last one
  disabled-worlds: []
    # - "arena_world"           # No return point is saved (on death or teleport) while a player is in these worlds
                                # Bypass: aircore.bypass.teleport.disabled-worlds.back

  # Each entry controls whether that event saves a return point for /back
  save-on:
    death: true                 # Save a return point when a player dies
    teleport: true              # Save a return point whenever a player teleports