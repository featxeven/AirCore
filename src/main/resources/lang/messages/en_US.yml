# AirCore - Language Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# --------------------------------------------------
# REFERENCES
# Expand these references in any message below using:
# <ref:value> | <r:value> (shorthand)
# --------------------------------------------------
references:
  prefix: "<gray>[<gradient:#00ffcc:#0066ff>AirCore</gradient>]</gray>"
  url_spigot: "https://www.spigotmc.org/resources/130425/"
  url_modrinth: "https://modrinth.com/plugin/aircore"
  success: "<sound:entity.player.levelup:1:2>"
  error: "<sound:block.note_block.didgeridoo:1:0.5>"
  # custom_message: "<rainbow>Hello!"

# --------------------------------------------------
# GENERAL
# --------------------------------------------------
general:
  console-name: "@Console"

  commands:
    usage:
      - "<ref:prefix> <white>Available commands:"
      - "  <yellow>/aircore reload <dark_gray>- <gray>Reload all configuration files"
      - "  <yellow>/aircore open <gui-id> <player> [target] [args] <dark_gray>- <gray>Open a specific GUI"
      - "  <yellow>/aircore version <dark_gray>- <gray>Check plugin version"
      - "  <yellow>/aircore variable <dark_gray>- <gray>Manage plugin variables"
      - "  <yellow>/aircore announcement <dark_gray>- <gray>Manage plugin announcements"
      - "  <yellow>/aircore placeholder <dark_gray>- <gray>Manage plugin placeholders"
      - "  <yellow>/aircore migrate <dark_gray>- <gray>Migrate database from other plugins"

    reload:
      - "<ref:prefix> <green>Configuration reloaded successfully in <white>%time%ms</white>."
      - "<sound:block.note_block.chime:1:2>"

    version: "<ref:prefix> <gray>Running <white>AirCore <gradient:#00ffcc:#0066ff>%version%</gradient></white>."

    outdated:
      - "<ref:prefix> <gold>A new update is available!"
      - "  <gray>Current: <white>%current%"
      - "  <gray>Latest: <gradient:#00ffcc:#0066ff>%latest%"
      - "  <gray>Download on <yellow><click:open_url:'<ref:url_spigot>'><hover:show_text:'<yellow>Click to go to SpigotMC'>[SpigotMC]</hover></click> <green><click:open_url:'<ref:url_modrinth>'><hover:show_text:'<green>Click to go to Modrinth'>[Modrinth]</hover></click>"

    # --------------------------------------------------
    # VARIABLES
    # --------------------------------------------------
    variables:
      list:
        header:
          - "<ref:prefix> <gray>Variables <white>(%count%)</white><dark_gray>:"
          - "%variables%"
        entry: "  <yellow>%variable% <dark_gray>- <gray>%type% <dark_gray>(<gray>%scope%<dark_gray>) <dark_gray>- <white>%value%"
        separator: "<newline>"
        empty: "<ref:prefix> <red>There are no variables configured."

      get:
        self: "<ref:prefix> <gray>Variable <white>%variable%</white>: <white>%value%</white>."
        other: "<ref:prefix> <gray><white>%target%</white>'s variable <white>%variable%</white>: <white>%value%</white>."
        global: "<ref:prefix> <gray>Global variable <white>%variable%</white>: <white>%value%</white>."

      set:
        self: "<ref:prefix> <gray>Variable <white>%variable%</white> set to <white>%value%</white>."
        other: "<ref:prefix> <gray>Set <white>%target%</white>'s variable <white>%variable%</white> to <white>%value%</white>."
        by: "<ref:prefix> <gray><white>%player%</white> set your variable <white>%variable%</white> to <white>%value%</white>."
        global: "<ref:prefix> <gray>Set global variable <white>%variable%</white> to <white>%value%</white>."

      add:
        self: "<ref:prefix> <gray>Added <white>%amount%</white> to variable <white>%variable%</white>. <dark_gray>(<gray>Now: <white>%value%<dark_gray>)"
        other: "<ref:prefix> <gray>Added <white>%amount%</white> to <white>%target%</white>'s variable <white>%variable%</white>. <dark_gray>(<gray>Now: <white>%value%<dark_gray>)"
        by: "<ref:prefix> <gray><white>%player%</white> added <white>%amount%</white> to your variable <white>%variable%</white>."
        global: "<ref:prefix> <gray>Added <white>%amount%</white> to global variable <white>%variable%</white>. <dark_gray>(<gray>Now: <white>%value%<dark_gray>)"

      reset:
        self: "<ref:prefix> <gray>Variable <white>%variable%</white> reset to its default value. <dark_gray>(<gray><white>%value%<dark_gray>)"
        other: "<ref:prefix> <gray>Reset <white>%target%</white>'s variable <white>%variable%</white>. <dark_gray>(<gray><white>%value%<dark_gray>)"
        by: "<ref:prefix> <gray><white>%player%</white> reset your variable <white>%variable%</white>. <dark_gray>(<gray><white>%value%<dark_gray>)"
        global: "<ref:prefix> <gray>Reset global variable <white>%variable%</white>. <dark_gray>(<gray><white>%value%<dark_gray>)"

      toggle:
        enabled: "<ref:prefix> <gray>Variable <white>%variable%</white> <white>enabled</white>."
        disabled: "<ref:prefix> <gray>Variable <white>%variable%</white> <white>disabled</white>."
        enabled-for: "<ref:prefix> <gray>Enabled variable <white>%variable%</white> for <white>%target%</white>."
        disabled-for: "<ref:prefix> <gray>Disabled variable <white>%variable%</white> for <white>%target%</white>."
        enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled variable <white>%variable%</white> for you."
        disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled variable <white>%variable%</white> for you."
        enabled-global: "<ref:prefix> <gray>Global variable <white>%variable%</white> <white>enabled</white>."
        disabled-global: "<ref:prefix> <gray>Global variable <white>%variable%</white> <white>disabled</white>."

      errors:
        argument:
          unknown-variable: "<ref:prefix> <red>Unknown variable <white>%variable%</white>."
          invalid-argument: "<ref:prefix> <red>Invalid value <white>%value%</white> for argument <white>%argument%</white>."
          missing-argument: "<ref:prefix> <red>Missing required argument: <white>%argument%</white>."

        data:
          wrong-type: "<ref:prefix> <red>Variable <white>%variable%</white> is a <white>%type%</white>, not a <white>%expected%</white>."
          not-player-scoped: "<ref:prefix> <red>Variable <white>%variable%</white> is global. <gray>Omit the player argument."
          not-global-scoped: "<ref:prefix> <red>Variable <white>%variable%</white> is player-scoped. <gray>A player argument is required."
          invalid-boolean: "<ref:prefix> <red>Value must be <white>true</white> or <white>false</white>."
          invalid-number: "<ref:prefix> <red>Value <white>%value%</white> is not a valid number."
          not-allowed-value: "<ref:prefix> <red>Value <white>%value%</white> is not allowed. <dark_gray>(<gray>Allowed: <white>%allowed%<dark_gray>)"

    # --------------------------------------------------
    # ANNOUNCEMENTS
    # --------------------------------------------------
    announcements:
      list:
        header:
          - "<ref:prefix> <gray>Announcements <white>(%count%)</white><dark_gray>: %announcements%"

        # How each entry is formatted inside %announcements%.
        entry-enabled: "<green>%announcement%</green>"
        entry-disabled: "<red>%announcement%</red>"
        entry-file-disabled: "<dark_gray>%announcement%</dark_gray>"

        # Separator between entries.
        separator: "<gray>, "

        # Shown instead of header+entries when no announcements are configured.
        empty: "<ref:prefix> <red>There are no announcements configured."

      triggered: "<ref:prefix> <gray>Announcement <white>%announcement%</white> triggered."

      errors:
        not-found: "<ref:prefix> <red>Announcement <white>%announcement%</white> not found."
        disabled: "<ref:prefix> <red>Announcement <white>%announcement%</white> is disabled."

    # --------------------------------------------------
    # CUSTOM PLACEHOLDERS
    # --------------------------------------------------
    placeholders:
      list:
        header:
          - "<ref:prefix> <gray>Registered placeholders <white>(%count%)</white><dark_gray>: %placeholders%"
        # How each placeholder entry is formatted inside %placeholders%.
        entry: "<white>%placeholder%</white>"
        # Separator between entries.
        separator: "<gray>, "
        # Shown instead of header+entries when no placeholders are registered.
        empty: "<ref:prefix> <red>There are no placeholders registered."

      parsed: "<ref:prefix> <gray>Placeholder <white>%placeholder%</white>:</gray> %value%"

      errors:
        not-found: "<ref:prefix> <red>Placeholder <white>%placeholder%</white> was not found."

# --------------------------------------------------
# PLACEHOLDERS
# --------------------------------------------------
placeholders:
  # Used for teleport request expirations and kit cooldowns.
  never: "<red>Never"
  # Used for home, block and teleport request limits.
  unlimited: "<gold>Unlimited"
  # Used for /afk <reason> when no reason is given.
  no-reason: "<red>No reason"

  # Fallback text shown when a value is absent or not applicable.
  empty:
    tax: "<red>-"
    leaderboard: "<dark_gray>-"

  # Unit labels used when formatting durations.
  time:
    tick: " tick"
    ticks: " ticks"
    second: " second"
    seconds: " seconds"
    minute: " minute"
    minutes: " minutes"
    hour: " hour"
    hours: " hours"
    day: " day"
    days: " days"

# --------------------------------------------------
# ERRORS
# --------------------------------------------------
errors:
  reload-failed: "<ref:prefix> <red>Reload failed - check console for details."
  database: "<ref:prefix> <red>A database error occurred. Please try again or contact an administrator."

  access:
    no-permission: "<ref:prefix> <red>Missing permission. <dark_gray>(<gray>%permission%<dark_gray>)"
    player-only: "<ref:prefix> <red>This command can only be run by a player."
    console-only: "<ref:prefix> <red>This command can only be run from the console."
    player-not-found: "<ref:prefix> <red>Player <white>%player%</white> was not found."
    player-never-joined: "<ref:prefix> <red>Player <white>%player%</white> has never joined the server."
    gui-not-found: "<ref:prefix> <red>GUI <white>%gui%</white> was not found or is disabled."
    no-players-online: "<ref:prefix> <red>No players are online right now."
    incorrect-usage: "<ref:prefix> <red>Usage: <white>%usage%"
    too-many-arguments: "<ref:prefix> <red>Too many arguments. <gray>Usage: <white>%usage%"
    invalid-param: "<ref:prefix> <red>Unknown parameter <white>%param%</white>."
    invalid-param-value: "<ref:prefix> <red>Invalid value <white>%value%</white> for parameter <white>%param%</white>."
    conflicting-params: "<ref:prefix> <red>You can't use those parameters together."

  general:
    invalid-amount: "<ref:prefix> <red>That's an invalid amount."
    invalid-time: "<ref:prefix> <red>That's an invalid time. <gray>Use a tick count (e.g. <white>6000</white>), a duration like <white>5m</white>, or <white>day</white>/<white>noon</white>/<white>night</white>/<white>midnight</white>."
    command-cooldown: "<ref:prefix> <red>Wait <white>%timeout%</white> before using this command again."
    world-not-found: "<ref:prefix> <red>World <white>%world%</white> was not found."
    world-no-clock: "<ref:prefix> <red>World <white>%world%</white> has no day/night cycle, so its time can't be changed."
    world-restricted: "<ref:prefix> <red>This feature is disabled in <white>%world%</white>."
    world-restricted-for: "<ref:prefix> <red>This feature is disabled for <white>%target%</white> in <white>%world%</white>."
    # Used for GUIs with dynamic items (e.g. homes)
    stale-entry: "<ref:prefix> <red>That's no longer available."

# --------------------------------------------------
# CHAT
# --------------------------------------------------
chat:
  broadcast:
    - " "
    - "<gradient:#00ffcc:#0066ff><bold>BROADCAST</bold></gradient> <dark_gray>> <gray>%message%"
    - " "
    - "<ref:success>"

  # --------------------------------------------------
  # CHAT - CHANNELS
  # --------------------------------------------------
  channel:
    switched: "<ref:prefix> <gray>Switched to <white>%channel%</white> channel."
    switched-for: "<ref:prefix> <gray>Switched <white>%target%</white> to <white>%channel%</white> channel."
    switched-all: "<ref:prefix> <gray>Switched everyone to <white>%channel%</white> channel."
    switched-by: "<ref:prefix> <white>%player%</white> <gray>switched you to <white>%channel%</white> channel."

    member-joined: "<ref:prefix> <gray><white>%player%</white> joined <white>%channel%</white> channel."
    member-left: "<ref:prefix> <gray><white>%player%</white> left <white>%channel%</white> channel."

    list:
      header:
        - "<ref:prefix> <gray>Available channels <white>(%count%)</white><dark_gray>:"
        - "%channels%"
      # How each channel entry is formatted inside %channels%.
      entry: "  <dark_gray>•</dark_gray> <yellow>%channel%</yellow> <dark_gray>- <gray>%description%"
      # Separator between entries.
      separator: "<newline>"
      # Shown instead of header+entries when no channels exist.
      empty: "<ref:prefix> <red>No channels available."
      # Shown when no channel description exist on %description%.
      no-description: "<red>No description"

    errors:
      not-found: "<ref:prefix> <red>Channel <white>%channel%</white> was not found."
      no-permission: "<ref:prefix> <red>You don't have permission to join <white>%channel%</white>."
      already-in: "<ref:prefix> <red>You are already in <white>%channel%</white> channel."
      already-in-for: "<ref:prefix> <red><white>%target%</white> is already in <white>%channel%</white> channel."

  # --------------------------------------------------
  # CHAT - MESSAGES
  # --------------------------------------------------
  msg:
    sent: "<gray>[MSG] <white>%player%</white> <dark_gray>→ <white>%target%</white> <dark_gray>» <gray>%message%"
    received:
      - "<gray>[MSG] <white>%player%</white> <dark_gray>→ <white>%target%</white> <dark_gray>» <gray>%message%"
      - "<sound:entity.chicken.egg:1:2>"
    broadcast: "<gray>[MSG] <white>%player%</white> <dark_gray>→ <aqua>@everyone <dark_gray>» <gray>%message%"

    errors:
      self: "<ref:prefix> <red>You can't message yourself."
      disabled: "<ref:prefix> <red><white>%player%</white> has private messages turned off."
      no-reply: "<ref:prefix> <red>You have no one to reply to."

  # --------------------------------------------------
  # CHAT - SPY
  # --------------------------------------------------
  spy:
    msg: "<dark_gray>[SPY] <gray>%player%</gray> <dark_gray>→ <gray>%target%</gray> <dark_gray>» <gray>%message%"
    broadcast: "<dark_gray>[SPY] <gray>%player%</gray> <dark_gray>→ <aqua>@everyone <dark_gray>» <gray>%message%"

    toggle:
      enabled: "<ref:prefix> <gray>Social spy <white>enabled</white>."
      disabled: "<ref:prefix> <gray>Social spy <white>disabled</white>."
      enabled-for: "<ref:prefix> <gray>Social spy enabled for <white>%target%</white>."
      disabled-for: "<ref:prefix> <gray>Social spy disabled for <white>%target%</white>."
      enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled social spy for you."
      disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled social spy for you."

  # --------------------------------------------------
  # CHAT - TOGGLES
  # --------------------------------------------------
  toggle:
    msg:
      enabled: "<ref:prefix> <gray>Private messages <white>enabled</white>."
      disabled: "<ref:prefix> <gray>Private messages <white>disabled</white>."
      enabled-for: "<ref:prefix> <gray>Private messages enabled for <white>%target%</white>."
      disabled-for: "<ref:prefix> <gray>Private messages disabled for <white>%target%</white>."
      enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled private messages for you."
      disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled private messages for you."

    mentions:
      enabled: "<ref:prefix> <gray>Mentions <white>enabled</white>."
      disabled: "<ref:prefix> <gray>Mentions <white>disabled</white>."
      enabled-for: "<ref:prefix> <gray>Mentions enabled for <white>%target%</white>."
      disabled-for: "<ref:prefix> <gray>Mentions disabled for <white>%target%</white>."
      enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled mentions for you."
      disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled mentions for you."

    chat:
      enabled: "<ref:prefix> <gray>Chat <white>enabled</white>."
      disabled: "<ref:prefix> <gray>Chat <white>disabled</white>."
      enabled-for: "<ref:prefix> <gray>Chat enabled for <white>%target%</white>."
      disabled-for: "<ref:prefix> <gray>Chat disabled for <white>%target%</white>."
      enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled chat for you."
      disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled chat for you."

    announcements:
      enabled: "<ref:prefix> <gray>Announcements <white>enabled</white>."
      disabled: "<ref:prefix> <gray>Announcements <white>disabled</white>."
      enabled-for: "<ref:prefix> <gray>Announcements enabled for <white>%target%</white>."
      disabled-for: "<ref:prefix> <gray>Announcements disabled for <white>%target%</white>."
      enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled announcements for you."
      disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled announcements for you."

  errors:
    cooldown: "<ref:prefix> <red>Please wait <white>%timeout%</white> before chatting again."

    filters:
      caps: "<ref:prefix> <red>Too many capital letters."
      spam: "<ref:prefix> <red>Please don't spam."
      advertising: "<ref:prefix> <red>Advertising is not allowed."
      profanity: "<ref:prefix> <red>Please watch your language."
      unicode: "<ref:prefix> <red>Your message contains disallowed characters."

# --------------------------------------------------
# ECONOMY
# --------------------------------------------------
economy:
  give:
    self: "<ref:prefix> <gray>Added <white>%amount%</white> to your balance."
    other: "<ref:prefix> <gray>Added <white>%amount%</white> to <white>%target%</white>'s balance."
    online: "<ref:prefix> <gray>Added <white>%amount%</white> to all online players."
    all: "<ref:prefix> <gray>Added <white>%amount%</white> to all players."
    by: "<ref:prefix> <gray><white>%player%</white> added <white>%amount%</white> to your balance."

  take:
    self: "<ref:prefix> <gray>Removed <white>%amount%</white> from your balance."
    other: "<ref:prefix> <gray>Removed <white>%amount%</white> from <white>%target%</white>'s balance."
    online: "<ref:prefix> <gray>Removed <white>%amount%</white> from all online players."
    all: "<ref:prefix> <gray>Removed <white>%amount%</white> from all players."
    by: "<ref:prefix> <red><white>%player%</white> removed <white>%amount%</white> from your balance."

  set:
    self: "<ref:prefix> <gray>Your balance set to <white>%amount%</white>."
    other: "<ref:prefix> <gray>Set <white>%target%</white>'s balance to <white>%amount%</white>."
    online: "<ref:prefix> <gray>Set all online players' balance to <white>%amount%</white>."
    all: "<ref:prefix> <gray>Set all players' balance to <white>%amount%</white>."
    by: "<ref:prefix> <gray><white>%player%</white> set your balance to <white>%amount%</white>."

  reset:
    self: "<ref:prefix> <gray>Your balance has been reset."
    other: "<ref:prefix> <gray>Reset <white>%target%</white>'s balance."
    online: "<ref:prefix> <gray>Reset all online players' balance."
    all: "<ref:prefix> <gray>Reset all players' balance."
    by: "<ref:prefix> <red><white>%player%</white> reset your balance."

  errors:
    below-min: "<ref:prefix> <red>Amount can't go below <white>%min%</white>."
    above-max: "<ref:prefix> <red>Amount can't exceed <white>%max%</white>."

  # --------------------------------------------------
  # ECONOMY - BALANCE
  # --------------------------------------------------
  balance:
    self: "<ref:prefix> <gray>Your balance: <white>%balance%</white>."
    other: "<ref:prefix> <gray><white>%target%</white>'s balance: <white>%balance%</white>."

  # --------------------------------------------------
  # ECONOMY - BALTOP
  # --------------------------------------------------
  baltop:
    # Shown when its GUI is disabled in commands.yml.
    list:
      header:
        - "<ref:prefix> <gray>Top balances <white>(%count%)</white><dark_gray>:"
        - "%entries%"

      # How each entry is formatted inside %entries%.
      entry: "  <yellow>#%rank%</yellow> <white>%player%</white> <dark_gray>- <white>%balance%</white>"

      # Separator between entries.
      separator: "<newline>"

      # Shown instead of header+entries when no balances qualify to be listed.
      empty: "<ref:prefix> <red>There are no balances to show."

  # --------------------------------------------------
  # ECONOMY - PAY
  # --------------------------------------------------
  pay:
    # Confirmation prompt used when confirmation GUI is disabled.
    confirmation:
      request:
        - "<ref:prefix> <gray>Sending payment of <white>%amount%</white> to <white>%target%</white>."
        - "  <gray>Tax: <red>%tax_plain%"
        - "  <gray>Type the command again within <white>%timeout%</white> to confirm."
      expired:
        - "<ref:prefix> <red>Payment confirmation for <white>%amount%</white> to <white>%target%</white> timed out."
        - "<ref:error>"

    sent:
      - "<ref:prefix> <gray>Sent %amount% to <white>%target%</white>."
      - "  <gray>Tax: %tax_plain%"

    received: "<ref:prefix> <gray>Received %amount% from <white>%player%</white>."

    offline-notification:
      - "<ref:prefix> <gradient:#00ffcc:#0066ff><bold>Welcome back!</bold></gradient>"
      - "<gray>While you were offline:"
      - "<gray> - You received a total of %amount% in payments."
      - "<ref:success>"

    # --------------------------------------------------
    # ECONOMY - PAY (toggle)
    # --------------------------------------------------
    toggle:
      send:
        enabled: "<ref:prefix> <gray>Payments <white>enabled</white>."
        disabled: "<ref:prefix> <gray>Payments <white>disabled</white>."
        enabled-for: "<ref:prefix> <gray>Payments enabled for <white>%target%</white>."
        disabled-for: "<ref:prefix> <gray>Payments disabled for <white>%target%</white>."
        enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled payments for you."
        disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled payments for you."

      confirm:
        enabled: "<ref:prefix> <gray>Payment confirmations <white>enabled</white>."
        disabled: "<ref:prefix> <gray>Payment confirmations <white>disabled</white>. <gray>Payments will send instantly."
        enabled-for: "<ref:prefix> <gray>Payment confirmations enabled for <white>%target%</white>."
        disabled-for: "<ref:prefix> <gray>Payment confirmations disabled for <white>%target%</white>."
        enabled-by: "<ref:prefix> <gray><white>%player%</white> enabled payment confirmations for you."
        disabled-by: "<ref:prefix> <gray><white>%player%</white> disabled payment confirmations for you."

    errors:
      self: "<ref:prefix> <red>You can't pay yourself."
      insufficient: "<ref:prefix> <red>You're missing <white>%amount%</white> to do this."
      below-min: "<ref:prefix> <red>Minimum payment is <white>%min%</white>."
      above-max: "<ref:prefix> <red>Maximum payment is <white>%max%</white>."
      exceed-max: "<ref:prefix> <red>This would exceed <white>%target%</white>'s maximum balance allowed. <dark_gray>(<gray>Limit: <white>%limit%<dark_gray>)"
      disabled: "<ref:prefix> <red><white>%target%</white> has payments disabled."

  # --------------------------------------------------
  # ECONOMY - SELL
  # --------------------------------------------------
  sell:
    success:
      - "<ref:prefix> <gray>Sold items for <white>%amount%</white>."
      - "  <gray>Tax: <red>%tax_plain%"

    errors:
      nothing: "<ref:prefix> <red>No sellable items found."
      invalid: "<ref:prefix> <red>This item cannot be sold."
      some-invalid: "<ref:prefix> <red>Some items could not be sold."
      exceed-max: "<ref:prefix> <red>Selling these would exceed your maximum balance. <dark_gray>(<gray>Limit: <white>%limit%<dark_gray>)"

# --------------------------------------------------
# TELEPORT
# --------------------------------------------------
teleport:
  countdown:
    - "<actionbar:'<gray>Teleporting in <white>%time%</white>...'>"
    - "<sound:ui.button.click:0.3:2>"

  errors:
    blocked-world: "<ref:prefix> <red>Teleportation is disabled in <white>%world%</white>."
    unsafe-destination: "<ref:prefix> <red>No safe location was found near the destination."
    destination-offline: "<ref:prefix> <red>Teleport cancelled - <white>%target%</white> went offline."

  # --------------------------------------------------
  # TELEPORT - TP
  # Shared by /tp, /tphere, and the online-target path of /tpoffline.
  # --------------------------------------------------
  tp:
    self: "<ref:prefix> <gray>Teleported to <white>%target%</white>."
    cancelled: "<ref:prefix> <red>Teleport to <white>%target%</white> cancelled."

    other:
      to-player: "<ref:prefix> <gray>Teleported <white>%player%</white> to <white>%target%</white>."
      to-self: "<ref:prefix> <gray>Teleported <white>%player%</white> to you."

